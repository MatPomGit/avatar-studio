name: Avatar Production Export

on:
  workflow_dispatch:
    inputs:
      quality_preset:
        description: "Export quality"
        required: true
        default: "high"
        type: choice
        options:
          - high
          - balanced
          - fast
      run_ue_export:
        description: "Run Unreal Engine export on the self-hosted workstation"
        required: true
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: avatar-production-export
  cancel-in-progress: false

jobs:
  validate_and_prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,geometry,vision]"
      - name: Validate Python integrity
        run: |
          python -m compileall -q apps/avatar_studio/src scripts tests
          ruff check apps/avatar_studio/src scripts tests
          pytest -q
      - name: Generate blendshape manifest
        run: python scripts/metahuman_processor.py
      - name: Create animation manifest
        run: python scripts/animation_baking.py
      - name: Upload generated manifests
        uses: actions/upload-artifact@v7
        with:
          name: generated-avatar-manifests
          path: |
            source/metahuman/processed/*.json
            animations/manifest.json
            animations/ANIMATION_IMPORT_GUIDE.md
          if-no-files-found: warn
          retention-days: 3

  photogrammetry_scan:
    runs-on: ubuntu-latest
    needs: validate_and_prepare
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - name: Setup Python + COLMAP
        run: |
          sudo apt-get update
          sudo apt-get install -y colmap
          python -m pip install opencv-python pillow numpy
      - name: Check source photographs
        id: photos
        run: |
          if find references/photos/raw -type f -print -quit 2>/dev/null | grep -q .; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "No source photographs found. Photogrammetry step will be skipped."
          fi
      - name: Run photogrammetry pipeline
        if: steps.photos.outputs.available == 'true'
        run: |
          python scripts/photogrammetry_pipeline.py \
            --photos references/photos/raw \
            --output source/scans/colmap_output
      - name: Upload scan results
        if: steps.photos.outputs.available == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: scan-results
          path: source/scans/colmap_output/
          if-no-files-found: warn
          retention-days: 3

  ue_export:
    if: ${{ inputs.run_ue_export }}
    runs-on: self-hosted
    needs: [validate_and_prepare, photogrammetry_scan]
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - name: Export from Unreal Engine
        run: |
          python scripts/ue_export_pipeline.py \
            --project . \
            --output exports/avatar_final.fbx
      - name: Validate FBX export
        run: python scripts/fbx_validator.py exports/avatar_final.fbx --html reports/fbx_validation.html
      - name: Upload production FBX and validation
        uses: actions/upload-artifact@v7
        with:
          name: avatar-fbx-export
          path: |
            exports/avatar_final.fbx
            reports/fbx_validation.html
          if-no-files-found: error
          retention-days: 3

  finalize_validation:
    if: ${{ !inputs.run_ue_export }}
    runs-on: ubuntu-latest
    needs: [validate_and_prepare, photogrammetry_scan]
    timeout-minutes: 5
    steps:
      - name: Summary
        run: |
          echo "Production preflight completed successfully."
          echo "Unreal Engine export was not requested, so no release was created."

  finalize_release:
    if: ${{ inputs.run_ue_export }}
    runs-on: ubuntu-latest
    needs: [validate_and_prepare, photogrammetry_scan, ue_export]
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - name: Generate export report
        run: |
          {
            echo "## Avatar Export Summary"
            echo "**Run:** ${{ github.run_number }}"
            echo "**Quality preset:** ${{ inputs.quality_preset }}"
            echo "**Status:** completed"
          } > EXPORT_REPORT.md
      - name: Create release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: export-${{ github.run_number }}
          name: Avatar Export #${{ github.run_number }}
          body_path: EXPORT_REPORT.md
          draft: false
