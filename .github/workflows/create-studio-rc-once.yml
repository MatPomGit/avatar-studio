name: One-shot create Avatar Studio prerelease tag

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/create-studio-rc-once.yml"

permissions:
  contents: write

jobs:
  tag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Create prerelease tag
        shell: bash
        run: |
          set -euo pipefail
          tag="studio-v0.3.0-rc1"
          if git ls-remote --exit-code --tags origin "refs/tags/$tag" >/dev/null 2>&1; then
            echo "Tag $tag already exists; nothing to do."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$tag" -m "Avatar Studio 0.3.0 release candidate 1"
          git push origin "$tag"
