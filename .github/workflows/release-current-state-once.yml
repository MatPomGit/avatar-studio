name: Release current Avatar Studio state once

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/release-current-state-once.yml"

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: windows-latest
            artifact: AvatarStudio-Windows.exe
            executable: dist/AvatarStudio.exe
          - os: ubuntu-latest
            artifact: AvatarStudio-Linux
            executable: dist/AvatarStudio
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
      - name: Install Linux GUI runtime dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1
      - name: Install desktop dependencies
        run: python -m pip install -e ".[dev,desktop,desktop-build]"
      - name: Run desktop tests
        run: python -m pytest -q tests/test_avatar_studio.py tests/test_gui_smoke.py
      - name: Build standalone application
        run: >-
          pyinstaller --noconfirm --clean --onefile --windowed
          --name AvatarStudio
          --collect-all trimesh
          apps/avatar_studio/launcher.py
      - name: Prepare release asset
        shell: bash
        run: |
          mkdir -p release
          cp "${{ matrix.executable }}" "release/${{ matrix.artifact }}"
      - name: Upload release asset for assembly
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}
          path: release/${{ matrix.artifact }}
          retention-days: 1

  release:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Download built assets
        uses: actions/download-artifact@v4
        with:
          pattern: AvatarStudio-*
          path: release-assets
          merge-multiple: true
      - name: Generate SHA-256 manifest
        shell: bash
        run: |
          cd release-assets
          sha256sum AvatarStudio-Windows.exe AvatarStudio-Linux > SHA256SUMS.txt
      - name: Publish Avatar Studio v0.3.0
        uses: softprops/action-gh-release@v3
        with:
          tag_name: studio-v0.3.0
          target_commitish: ${{ github.sha }}
          name: "Avatar Studio v0.3.0"
          generate_release_notes: true
          files: |
            release-assets/AvatarStudio-Windows.exe
            release-assets/AvatarStudio-Linux
            release-assets/SHA256SUMS.txt
