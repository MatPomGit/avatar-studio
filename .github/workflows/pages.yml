name: Documentation

on:
  pull_request:
    branches: [main]
    paths:
      - "docs/**"
      - "scripts/check_mkdocs_coverage.py"
      - "scripts/lint_docs_terminology.py"
      - "mkdocs.yml"
      - "pyproject.toml"
      - ".github/workflows/pages.yml"
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "scripts/check_mkdocs_coverage.py"
      - "scripts/lint_docs_terminology.py"
      - "mkdocs.yml"
      - "pyproject.toml"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip

      - name: Install documentation dependencies
        run: python -m pip install -e ".[docs]"

      - name: Validate documentation navigation coverage
        run: python scripts/check_mkdocs_coverage.py

      - name: Validate terminology
        run: python scripts/lint_docs_terminology.py

      - name: Build documentation
        run: mkdocs build --strict

      - name: Configure Pages
        if: github.event_name != 'pull_request'
        uses: actions/configure-pages@v6

      - name: Upload Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v5
        with:
          path: site

  deploy:
    if: github.event_name != 'pull_request'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 5
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
