name: One-shot Actions artifact cleanup
# retry-after-release-policy

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/artifact-cleanup-once.yml"

permissions:
  contents: read
  actions: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Delete stale workflow artifacts
        env:
          GH_TOKEN: ${{ github.token }}
          CUTOFF_DAYS: "2"
        shell: bash
        run: |
          set -euo pipefail
          cutoff_epoch="$(date -u -d "${CUTOFF_DAYS} days ago" +%s)"
          deleted=0
          freed=0

          while IFS=$'\t' read -r id name size created; do
            [ -z "${id:-}" ] && continue
            created_epoch="$(date -u -d "$created" +%s)"
            if (( created_epoch < cutoff_epoch )); then
              gh api --method DELETE \
                -H "X-GitHub-Api-Version: 2022-11-28" \
                "repos/${GITHUB_REPOSITORY}/actions/artifacts/$id"
              deleted=$((deleted + 1))
              freed=$((freed + size))
              echo "Deleted: $name ($size bytes, created $created)"
            fi
          done < <(
            gh api --paginate \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "repos/${GITHUB_REPOSITORY}/actions/artifacts?per_page=100" \
              --jq '.artifacts[] | [.id, .name, .size_in_bytes, .created_at] | @tsv'
          )

          {
            echo "### Artifact cleanup"
            echo "- cutoff: ${CUTOFF_DAYS} days"
            echo "- deleted artifacts: $deleted"
            echo "- bytes scheduled for removal: $freed"
          } >> "$GITHUB_STEP_SUMMARY"
