name: Desktop package

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - "apps/avatar_studio/**"
      - "pyproject.toml"
      - ".github/workflows/desktop.yml"
  push:
    branches: [main]
    paths:
      - "apps/avatar_studio/**"
      - "pyproject.toml"
      - ".github/workflows/desktop.yml"
    tags:
      - "studio-v*"

permissions:
  contents: read

jobs:
  package:
    strategy:
      matrix:
        include:
          - os: windows-latest
            artifact: AvatarStudio-Windows
            executable: dist/AvatarStudio.exe
          - os: ubuntu-latest
            artifact: AvatarStudio-Linux
            executable: dist/AvatarStudio
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
      - name: Install Linux GUI runtime dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1
      - name: Install desktop dependencies
        run: python -m pip install -e ".[dev,desktop,desktop-build]"
      - name: Run desktop state and GUI smoke tests
        run: python -m pytest -q tests/test_avatar_studio.py tests/test_gui_smoke.py
      - name: Build standalone application
        run: >-
          pyinstaller --noconfirm --clean --onefile --windowed
          --name AvatarStudio
          --collect-all trimesh
          apps/avatar_studio/launcher.py
      - name: Smoke-check packaged executable
        shell: bash
        run: test -f "${{ matrix.executable }}"
      - name: Upload package
        if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/studio-v')
        uses: actions/upload-artifact@v7
        with:
          retention-days: 7
          name: ${{ matrix.artifact }}
          path: ${{ matrix.executable }}
          if-no-files-found: error
