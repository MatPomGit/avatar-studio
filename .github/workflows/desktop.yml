name: Desktop package

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - "apps/avatar_studio/**"
      - "pyproject.toml"
      - ".github/workflows/desktop.yml"
  push:
    branches: [main]
    paths:
      - "apps/avatar_studio/**"
      - "pyproject.toml"
      - ".github/workflows/desktop.yml"
    tags:
      - "studio-v*"

permissions:
  contents: write
  actions: write

jobs:
  package:
    strategy:
      matrix:
        include:
          - os: windows-latest
            artifact: AvatarStudio-Windows
            executable: dist/AvatarStudio.exe
            release_file: AvatarStudio-Windows.exe
          - os: ubuntu-latest
            artifact: AvatarStudio-Linux
            executable: dist/AvatarStudio
            release_file: AvatarStudio-Linux
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
      - name: Install Linux GUI runtime dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1
      - name: Install desktop dependencies
        run: python -m pip install -e ".[dev,desktop,desktop-build]"
      - name: Run desktop state and GUI smoke tests
        run: python -m pytest -q tests/test_avatar_studio.py tests/test_gui_smoke.py
      - name: Build standalone application
        run: >-
          pyinstaller --noconfirm --clean --onefile --windowed
          --name AvatarStudio
          --collect-all trimesh
          apps/avatar_studio/launcher.py
      - name: Smoke-check packaged executable
        shell: bash
        run: test -f "${{ matrix.executable }}"
      - name: Prepare distributable name
        shell: bash
        run: |
          mkdir -p release
          cp "${{ matrix.executable }}" "release/${{ matrix.release_file }}"
      - name: Upload package
        if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/studio-v')
        uses: actions/upload-artifact@v7
        with:
          retention-days: 3
          name: ${{ matrix.artifact }}
          path: release/${{ matrix.release_file }}
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/studio-v')
    needs: package
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Download packaged executables
        uses: actions/download-artifact@v4
        with:
          pattern: AvatarStudio-*
          path: release-assets
          merge-multiple: true

      - name: Generate SHA-256 manifest
        shell: bash
        run: |
          cd release-assets
          sha256sum AvatarStudio-Windows.exe AvatarStudio-Linux > SHA256SUMS.txt

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          files: |
            release-assets/AvatarStudio-Windows.exe
            release-assets/AvatarStudio-Linux
            release-assets/SHA256SUMS.txt

      - name: Delete transient Actions artifacts
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh api --paginate \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "repos/${GITHUB_REPOSITORY}/actions/artifacts?per_page=100" \
            --jq '.artifacts[] | select(.workflow_run.id == ${{ github.run_id }}) | .id' \
          | while read -r artifact_id; do
              [ -z "$artifact_id" ] && continue
              gh api --method DELETE \
                -H "X-GitHub-Api-Version: 2022-11-28" \
                "repos/${GITHUB_REPOSITORY}/actions/artifacts/$artifact_id"
            done
