name: Desktop package

on:
  workflow_dispatch:
  push:
    tags:
      - "studio-v*"

permissions:
  contents: write

concurrency:
  group: avatar-desktop-${{ github.ref }}
  cancel-in-progress: true

jobs:
  package:
    strategy:
      matrix:
        include:
          - os: windows-latest
            artifact: AvatarStudio-Windows
            executable: dist/AvatarStudio.exe
            release_file: AvatarStudio-Windows.exe
          - os: ubuntu-latest
            artifact: AvatarStudio-Linux
            executable: dist/AvatarStudio
            release_file: AvatarStudio-Linux
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
      - name: Install Linux GUI runtime dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libegl1
      - name: Install desktop dependencies
        run: python -m pip install -e ".[dev,desktop,desktop-build]"
      - name: Run smoke tests
        run: python -m pytest -q tests/test_avatar_studio.py tests/test_gui_smoke.py
      - name: Build standalone application
        run: pyinstaller --noconfirm --clean --onefile --windowed --name AvatarStudio --collect-all trimesh apps/avatar_studio/launcher.py
      - name: Prepare distributable
        shell: bash
        run: |
          mkdir -p release
          cp "${{ matrix.executable }}" "release/${{ matrix.release_file }}"
      - name: Upload package for release handoff
        if: startsWith(github.ref, 'refs/tags/studio-v')
        uses: actions/upload-artifact@v7
        with:
          retention-days: 1
          name: ${{ matrix.artifact }}
          path: release/${{ matrix.release_file }}
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/studio-v')
    needs: package
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: AvatarStudio-*
          path: release-assets
          merge-multiple: true
      - name: Generate SHA-256 manifest
        run: |
          cd release-assets
          sha256sum AvatarStudio-Windows.exe AvatarStudio-Linux > SHA256SUMS.txt
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          prerelease: ${{ contains(github.ref_name, '-rc') }}
          generate_release_notes: true
          files: |
            release-assets/AvatarStudio-Windows.exe
            release-assets/AvatarStudio-Linux
            release-assets/SHA256SUMS.txt
