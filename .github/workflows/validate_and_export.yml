name: CI

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python-checks:
    if: ${{ github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install development tools
        run: python -m pip install --disable-pip-version-check --quiet -e ".[dev,geometry,vision]"

      - name: Compile Python sources
        run: python -m compileall -q apps/avatar_studio/src scripts tests

      - name: Check critical Python errors
        run: ruff check apps/avatar_studio/src scripts tests

      - name: Run unit and workflow contract tests
        run: pytest -q
