name: Publish Avatar Studio v0.3.0 once

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/release-v0.3.0-once.yml"

permissions:
  contents: write
  actions: write

jobs:
  package:
    strategy:
      matrix:
        include:
          - os: windows-latest
            executable: dist/AvatarStudio.exe
            release_file: AvatarStudio-Windows.exe
            artifact: AvatarStudio-Windows
          - os: ubuntu-latest
            executable: dist/AvatarStudio
            release_file: AvatarStudio-Linux
            artifact: AvatarStudio-Linux
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
      - name: Verify declared version
        shell: bash
        run: |
          python - <<'PY'
          import tomllib
          with open("pyproject.toml", "rb") as fh:
              version = tomllib.load(fh)["project"]["version"]
          if version != "0.3.0":
              raise SystemExit(f"Expected 0.3.0, found {version}")
          PY
      - name: Install Linux GUI runtime dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1
      - name: Install desktop dependencies
        run: python -m pip install -e ".[dev,desktop,desktop-build]"
      - name: Run desktop smoke tests
        run: python -m pytest -q tests/test_avatar_studio.py tests/test_gui_smoke.py
      - name: Build standalone application
        run: >-
          pyinstaller --noconfirm --clean --onefile --windowed
          --name AvatarStudio
          --collect-all trimesh
          apps/avatar_studio/launcher.py
      - name: Prepare release file
        shell: bash
        run: |
          mkdir -p release
          cp "${{ matrix.executable }}" "release/${{ matrix.release_file }}"
      - name: Upload transient package
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}
          path: release/${{ matrix.release_file }}
          retention-days: 1
          if-no-files-found: error

  release:
    needs: package
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: Refuse to overwrite an existing release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          if gh api "repos/${GITHUB_REPOSITORY}/releases/tags/studio-v0.3.0" >/dev/null 2>&1; then
            echo "::error::studio-v0.3.0 already exists"
            exit 2
          fi
      - name: Download packaged executables
        uses: actions/download-artifact@v4
        with:
          pattern: AvatarStudio-*
          path: release-assets
          merge-multiple: true
      - name: Generate SHA-256 manifest
        shell: bash
        run: |
          cd release-assets
          sha256sum AvatarStudio-Windows.exe AvatarStudio-Linux > SHA256SUMS.txt
      - name: Publish v0.3.0
        uses: softprops/action-gh-release@v3
        with:
          tag_name: studio-v0.3.0
          target_commitish: ${{ github.sha }}
          name: "Avatar Studio v0.3.0"
          generate_release_notes: true
          files: |
            release-assets/AvatarStudio-Windows.exe
            release-assets/AvatarStudio-Linux
            release-assets/SHA256SUMS.txt
      - name: Delete transient artifacts from this run
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh api --paginate \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "repos/${GITHUB_REPOSITORY}/actions/artifacts?per_page=100" \
            --jq '.artifacts[] | select(.workflow_run.id == ${{ github.run_id }}) | .id' \
          | while read -r artifact_id; do
              [ -z "$artifact_id" ] && continue
              gh api --method DELETE \
                -H "X-GitHub-Api-Version: 2022-11-28" \
                "repos/${GITHUB_REPOSITORY}/actions/artifacts/$artifact_id"
            done
