name: Pipeline contract validation

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    paths:
      - "apps/avatar_studio/**"
      - "scripts/**"
      - "tests/**"
      - "docs/**"
      - "pyproject.toml"
      - "mkdocs.yml"
      - ".github/workflows/avatar_complete_pipeline.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
      - name: Install development dependencies
        run: python -m pip install -e ".[dev,docs]"
      - name: Test
        run: python -m pytest -q
      - name: Lint
        run: ruff check scripts apps tests
      - name: Build documentation
        run: mkdocs build --strict
      - name: Explain workstation boundary
        run: echo "COLMAP, Blender, Piper and runtime-engine production jobs remain local workstation tasks by architecture."
