[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "avatar-studio"
version = "0.3.0"
description = "Avatar Studio: professional tooling, documentation and desktop guidance for a photorealistic editable real-time digital human pipeline."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "PyYAML>=6,<7",
]

[project.optional-dependencies]
dev = [
    "pytest>=8,<10",
    "ruff>=0.12,<1",
    "pillow>=10,<13",
]
docs = [
    "mkdocs>=1.6,<2",
    "mkdocs-material>=9.6,<10",
]
desktop = [
    "PySide6>=6.8,<7",
    "numpy>=1.26,<3",
    "trimesh>=4,<6",
    "pillow>=10,<13",
]
desktop-build = [
    "pyinstaller>=6.11,<7",
]
geometry = [
    "numpy>=1.26,<3",
    "scipy>=1.11,<2",
    "trimesh>=4,<6",
    "open3d>=0.18,<1",
]
vision = [
    "numpy>=1.26,<3",
    "pillow>=10,<13",
    "opencv-python>=4.8,<6",
]

[project.scripts]
avatar-studio = "avatar_studio.__main__:main"

[tool.setuptools.packages.find]
where = ["apps/avatar_studio/src"]
include = ["avatar_studio*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E9", "F63", "F7", "F82"]
